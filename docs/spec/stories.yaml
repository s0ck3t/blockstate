    SIGTERM/SIGINT local WAL drain (.blockstate/wal/ledger.wal), and FileLedgerSink,
    PostgresLedgerSink, and S3LedgerSink drivers (CAP-16, CAP-17, AD-8 in SPEC.md).
    Build and pass 100% of LedgerSinkContractSuite across all ledger sinks (CAP-23, AD-11).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Follow strict TDD and British English spelling. Verify monotonic per-session
    causal ordering, SHA-256 hash-chain preservation under concurrent workers,
    zero record loss on simulated SIGTERM/SIGKILL, and 100% pass on
    LedgerSinkContractSuite.
