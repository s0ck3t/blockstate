[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blockstate"
version = "0.0.1a1"
description = "Deterministic statecharts, compile-time dominator proofs, and zero-trust tool gating for enterprise LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/s0ck3t/blockstate"
Repository = "https://github.com/s0ck3t/blockstate"
Issues = "https://github.com/s0ck3t/blockstate/issues"
Documentation = "https://github.com/s0ck3t/blockstate#readme"
