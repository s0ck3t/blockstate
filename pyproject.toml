[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "blockstate"
version = "0.0.1a1"
description = "Deterministic statecharts, compile-time dominator proofs, and zero-trust tool gating for enterprise LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Blockstate Contributors" },
]
dependencies = [
    "pydantic>=2.14.1,<3.0",
    "pydantic-settings>=2.16.1,<3.0",
    "cryptography>=50.0.2,<51.0",
    "typer>=0.27.3,<1.0",
    "rich>=15.0.0,<16.0",
]

[project.urls]
Homepage = "https://github.com/s0ck3t/blockstate"
Repository = "https://github.com/s0ck3t/blockstate"
Issues = "https://github.com/s0ck3t/blockstate/issues"
Documentation = "https://github.com/s0ck3t/blockstate#readme"
PatentNotice = "https://github.com/s0ck3t/blockstate/blob/main/PATENTS.md"

[project.scripts]
blockstate = "blockstate.cli.main:app"
blockstate-pii-guard = "blockstate.security.git_guard:main"

[project.optional-dependencies]
sqlite = [
    "aiosqlite>=0.22.1,<1.0",
]
postgres = [
    "asyncpg>=0.32.0,<1.0",
    "sqlalchemy>=2.1.6,<3.0",
    "greenlet>=3.0.0",
]
sql = [
    "sqlalchemy>=2.1.6,<3.0",
    "greenlet>=3.0.0",
]
s3 = [
    "aiobotocore>=3.0.0",
]
models = [
    "pydantic-ai-slim>=2.61.0,<3.0",
]
litellm = [
    "litellm>=1.106.0,<1.107.0",
]
onnx = [
    "onnxruntime>=1.31.0,<2.0",
    "tokenizers>=0.23.0,<1.0",
    "numpy>=1.26.0",
]
local = [
    "blockstate[onnx]",
    "blockstate[sqlite]",
]
system1 = [
    "blockstate[onnx]",
]
otel = [
    "opentelemetry-api>=1.45.1,<2.0",
    "opentelemetry-sdk>=1.45.1,<2.0",
]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "hypothesis>=6.100.0,<7.0",
    "ruff>=0.17.0,<1.0",
    "mypy>=2.4.0,<3.0",
    "import-linter>=2.0,<3.0",
    "pip-licenses>=5.0.0",
    "cyclonedx-bom>=5.0.0",
    "pip-audit>=2.8.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.0",
]
all = [
    "blockstate[sqlite,postgres,sql,s3,models,litellm,onnx,otel]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blockstate"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/blockstate",
    "LICENSE",
    "PATENTS.md",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["blockstate"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --strict-markers --ignore=tests/marketing_e2e --ignore=tests/unit/test_marketing_automation.py"
markers = [
    "patent_invariant: Core architectural invariant recited in the pending UK patent application (Claims 1-15); do not remove or break without logging for the 12-month priority filing.",
]

[tool.coverage.run]
source = ["blockstate"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.importlinter]
root_package = "blockstate"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal core and ports isolation"
type = "forbidden"
source_modules = [
    "blockstate.core",
    "blockstate.compiler",
    "blockstate.ports",
    "blockstate.security",
]
forbidden_modules = [
    "blockstate.adapters",
    "sqlalchemy",
    "asyncpg",
    "aiosqlite",
    "aioboto3",
    "litellm",
    "pydantic_ai",
    "onnxruntime",
    "opentelemetry",
]
