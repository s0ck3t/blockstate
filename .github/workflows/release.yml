name: Publish to PyPI (Manual Confirmation Only)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type PUBLISH_TO_PYPI to confirm publishing the full package to PyPI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish distribution to PyPI
    if: github.event.inputs.confirm_publish == 'PUBLISH_TO_PYPI'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blockstate/
    permissions:
      id-token: write  # Mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        run: uv publish
