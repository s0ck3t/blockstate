# =============================================================================
# Blockstate (blockstate) — Zero-Leakage & Enterprise Quality Git Hooks (AD-13)
# =============================================================================
# Install hooks locally:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Run across all files manually:
#   uv run pre-commit run --all-files
# =============================================================================

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
fail_fast: true

repos:
  # ---------------------------------------------------------------------------
  # 1. File Hygiene, Private Key Detection & Environment File Blocker
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ---------------------------------------------------------------------------
  # 2. Gitleaks — High-Speed Cryptographic Secret & Token Scanner (AD-13)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: "Security Gate: Gitleaks Secret & API Token Scan"

  # ---------------------------------------------------------------------------
  # 3. Yelp detect-secrets — High-Entropy Credential & DSN Blocker (AD-13)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "Security Gate: High-Entropy Secret & DSN Scan"
        exclude: '^(\.env\.example|tests/fixtures/synthetic_tokens\.json)$'

  # ---------------------------------------------------------------------------
  # 4. Ruff — Fast Rust Linter & Formatter
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # 5. Local Enterprise Governance Gates (PII Guard, Architecture & Licences)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: block-dotenv-and-trace-artifacts
        name: "Zero-Leakage Gate: Block .env, .blockstate/, WAL & DB files"
        entry: python -c "import sys; bad = [f for f in sys.argv[1:] if (f.endswith('.env') or '.env.' in f) and not f.endswith(('.env.example', '.env.template')) or '.blockstate/' in f.replace('\\\\', '/') or f.endswith(('.wal', '.db', '.sqlite', '.pem', '.key'))]; sys.exit('BLOCKED sensitive file(s): ' + ', '.join(bad) if bad else 0)"
        language: system
        pass_filenames: true

      - id: blockstate-pii-guard
        name: "Zero-Leakage Gate: Scan Staged Diffs for Raw PII (NINo, NHS, SSN, Cards, Bearer)"
        entry: python -c "import re, sys, pathlib; pat = re.compile(r'(\b[A-CEGHJ-PR-TW-Z]{2}\d{6}[A-D]\b|\b\d{3}-\d{2}-\d{4}\b|\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14})\b|Bearer\s+[A-Za-z0-9\-._~+/]+=*|sk-[A-Za-z0-9]{20,})'); hits = [(f, m.group(0)[:10]+'...') for f in sys.argv[1:] if pathlib.Path(f).is_file() for m in pat.finditer(pathlib.Path(f).read_text(encoding='utf-8', errors='ignore'))]; sys.exit('PII/Credential pattern detected: ' + str(hits) if hits else 0)"
        language: system
        types: [text]
        exclude: '^(\.pre-commit-config\.yaml|tests/unit/test_pii_patterns\.py)$'

      - id: import-linter-hexagonal
        name: "Architecture Gate: Enforce Hexagonal Core Isolation (AD-1)"
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: license-compliance-gate
        name: "Governance Gate: Verify Permissive Subcomponent Licences (AD-12)"
        entry: uv run pip-licenses --allow-only="MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Python-2.0;ISC;MPL-2.0"
        language: system
        pass_filenames: false
        stages: [pre-push]
