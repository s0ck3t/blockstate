# =============================================================================
# Blockstate (blockstate) — Zero-Leakage & Enterprise Quality Git Hooks (AD-13)
# =============================================================================
# Install hooks locally:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Run across all files manually:
#   uv run pre-commit run --all-files
# =============================================================================

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
fail_fast: true

repos:
  # ---------------------------------------------------------------------------
  # 1. File Hygiene, Private Key Detection & Environment File Blocker
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ---------------------------------------------------------------------------
  # 2. Gitleaks — High-Speed Cryptographic Secret & Token Scanner (AD-13)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: "Security Gate: Gitleaks Secret & API Token Scan"

  # ---------------------------------------------------------------------------
  # 3. Yelp detect-secrets — High-Entropy Credential & DSN Blocker (AD-13)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "Security Gate: High-Entropy Secret & DSN Scan"
        exclude: '^(\.env\.example|tests/)'

  # ---------------------------------------------------------------------------
  # 4. Ruff — Fast Rust Linter & Formatter
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  # ---------------------------------------------------------------------------
  # 5. Local Enterprise Governance Gates (PII Guard, mypy, Architecture & Licences)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: block-dotenv-and-trace-artifacts
        name: "Zero-Leakage Gate: Block .env, .blockstate/, WAL, DB, Patent & Marketing files"
        entry: >-
          python -c "import sys; bad = [f for f in sys.argv[1:] if ((f.endswith('.env') or '.env.' in f) and not f.endswith(('.env.example', '.env.template'))) or any(p in f.replace('\\\\', '/') for p in ('.blockstate/', 'marketing/', 'docs/patent/', 'tests/marketing_e2e/', 'test_marketing_automation.py', 'GEMINI.md', 'CLAUDE.md')) or f.endswith(('.wal', '.db', '.sqlite', '.pem', '.key', '.db-wal', '.db-shm'))]; sys.exit('BLOCKED sensitive/private file(s): ' + ', '.join(bad) if bad else 0)"
        language: system
        pass_filenames: true

      - id: blockstate-pii-guard
        name: "Zero-Leakage Gate: Scan Repository for Raw PII (NINo, NHS, SSN, Cards, Bearer)"
        entry: uv run blockstate-pii-guard src/blockstate/ pyproject.toml .pre-commit-config.yaml tests/unit/test_config.py tests/unit/test_errors.py tests/unit/test_ports.py
        language: system
        pass_filenames: false

      - id: mypy-strict
        name: "Type Safety Gate: Enforce mypy --strict on src and tests"
        entry: uv run mypy --strict --exclude "test_marketing_automation|marketing_e2e" src tests
        language: system
        pass_filenames: false

      - id: import-linter-hexagonal
        name: "Architecture Gate: Enforce Hexagonal Core Isolation (AD-1)"
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: license-compliance-gate
        name: "Governance Gate: Verify Permissive Subcomponent Licences (AD-12)"
        entry: >-
          uv run pip-licenses --partial-match --ignore-packages blockstate --allow-only="MIT;MIT License;MIT-0;0BSD;Apache-2.0;Apache Software License;Apache-2.0 OR BSD-3-Clause;Apache-2.0 OR BSD-2-Clause;Apache Software License; BSD License;BSD-2-Clause;BSD-3-Clause;3-Clause BSD License;BSD License;Python Software Foundation License;PSF-2.0;ISC;ISC License (ISCL);Mozilla Public License 2.0 (MPL 2.0);MPL-2.0"
        language: system
        pass_filenames: false
        stages: [pre-push]
